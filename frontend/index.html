<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>University Research Opportunity Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <header class="bg-primary text-white py-4">
        <div class="container">
            <h1 class="h3 mb-1">University Research Opportunity Portal</h1>
            <p class="mb-0">Explore and manage university research opportunities</p>
        </div>
    </header>

    <main class="container my-4">
        <div id="message" role="alert" aria-live="polite"></div>

        <div class="row g-4">
            <div class="col-lg-5">
                <section class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h2 class="h5 mb-0" id="formTitle">Create Opportunity</h2>
                    </div>

                    <div class="card-body">
                        <form id="opportunityForm">
                            <input type="hidden" id="opportunityId">

                            <div class="mb-3">
                                <label for="title" class="form-label">Research Title *</label>
                                <input class="form-control" id="title" maxlength="200" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description *</label>
                                <textarea class="form-control" id="description" rows="3" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="research_area" class="form-label">Research Area *</label>
                                <input class="form-control" id="research_area" maxlength="100" required>
                            </div>

                            <div class="mb-3">
                                <label for="faculty_name" class="form-label">Faculty Member *</label>
                                <input class="form-control" id="faculty_name" maxlength="150" required>
                            </div>

                            <div class="mb-3">
                                <label for="department" class="form-label">Department *</label>
                                <input class="form-control" id="department" maxlength="150" required>
                            </div>

                            <div class="mb-3">
                                <label for="required_skills" class="form-label">Required Skills *</label>
                                <textarea class="form-control" id="required_skills" rows="2" required></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="available_positions" class="form-label">Positions *</label>
                                    <input type="number" class="form-control" id="available_positions" min="1" step="1" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="application_deadline" class="form-label">Deadline *</label>
                                    <input type="date" class="form-control" id="application_deadline" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="status" class="form-label">Status *</label>
                                <select class="form-select" id="status">
                                    <option value="Open">Open</option>
                                    <option value="Closed">Closed</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary" id="saveButton">Create Opportunity</button>
                                <button type="button" class="btn btn-outline-secondary" id="cancelButton">Clear</button>
                            </div>
                        </form>
                    </div>
                </section>
            </div>

            <div class="col-lg-7">
                <section class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0">Research Opportunities</h2>
                        <button class="btn btn-outline-primary btn-sm" id="refreshButton">Refresh</button>
                    </div>
                    <div class="card-body">
                        <div id="opportunitiesList">Loading opportunities...</div>
                    </div>
                </section>

                <section class="card shadow-sm mt-4" id="detailsSection" hidden>
                    <div class="card-header bg-white">
                        <h2 class="h5 mb-0">Opportunity Details</h2>
                    </div>
                    <div class="card-body" id="detailsContent"></div>
                </section>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-4">
        University Research Opportunity Portal — CN Assignment #01
    </footer>

    <script src="/js/app.js"></script>
</body>
</html>
